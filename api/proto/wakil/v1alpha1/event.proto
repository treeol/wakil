syntax = "proto3";

package wakil.v1alpha1;

option go_package = "github.com/treeol/wakil/api/gen/wakil/v1alpha1;wakilv1alpha1";

import "google/protobuf/timestamp.proto";

// Event is the single envelope every domain event travels in (design §3.4).
// One envelope with a typed payload, not one struct per kind. The seq is
// monotonically increasing per session with no gaps; ephemeral events carry
// seq=0 and are never persisted (D2). A reconnecting client resumes from
// last_seq+1.
message Event {
  string   tenant_id  = 1;
  string   session_id = 2;
  uint64   seq        = 3;   // 0 for ephemeral; >= 1 for durable (per session)
  google.protobuf.Timestamp ts = 4;
  string   kind       = 5;   // domain kind string (e.g. "session_created")

  oneof payload {
    SessionCreatedPayload     session_created      = 10;
    TurnStartedPayload        turn_started         = 11;
    MessageDeltaPayload       message_delta        = 12;
    ReasoningDeltaPayload     reasoning_delta      = 13;
    ToolCallStartedPayload     tool_call_started    = 14;
    ApprovalRequestedPayload  approval_requested   = 15;
    ApprovalResolvedPayload   approval_resolved    = 16;
    ToolCallCompletedPayload  tool_call_completed  = 17;
    SubagentSpawnedPayload    subagent_spawned     = 18;
    SubagentProgressPayload   subagent_progress    = 19;
    SubagentCompletedPayload  subagent_completed   = 20;
    MemoryProposedPayload     memory_proposed      = 21;
    GuardTriggeredPayload     guard_triggered     = 22;
    ContextWarningPayload     context_warning     = 23;
    TurnCompletedPayload      turn_completed      = 24;
    SessionErrorPayload       session_error       = 25;
    SessionClosedPayload      session_closed      = 26;
    // 7b2 additions (D24/D28/D29)
    UserMessageCommittedPayload    user_message_committed    = 27;
    ConversationCompactedPayload   conversation_compacted   = 28;
    WorkflowTurnStartedPayload     workflow_turn_started    = 29;
    WorkflowFinalReviewPayload     workflow_final_review    = 30;
    AsyncJobStartedPayload         async_job_started        = 31;
    AsyncJobCompletedPayload       async_job_completed      = 32;
    SideQuestionCompletedPayload   side_question_completed  = 33;
    TokRatePayload                 tok_rate                 = 34;
    AsyncJobProgressPayload        async_job_progress       = 35;
    SideQuestionProgressPayload    side_question_progress   = 36;
    LearnNudgePayload              learn_nudge              = 37;
    SessionNotePayload             session_note             = 38;
    // 7c additions
    WorkflowOutcomePayload         workflow_outcome         = 39;
    WorkflowWarningPayload         workflow_warning         = 40;
  }
  // Reserved for future event kinds.
  reserved 41 to 50;
}

// --- Session lifecycle ---

message SessionCreatedPayload {
  string workspace_id = 1;
  string agent_name   = 2;
  string created_by   = 3;  // UserID
}

message SessionClosedPayload {
  string reason = 1;
}

message SessionErrorPayload {
  string reason = 1;  // e.g. "daemon_restart", "backend_failure"
  string err    = 2;
}

// --- Turn lifecycle ---

message TurnStartedPayload {
  string turn_id    = 1;
  uint64 turn_index = 2;  // 1-based per-session turn ordinal
}

message TurnCompletedPayload {
  string turn_id    = 1;
  string outcome    = 2;  // "complete" | "empty" | "stream_error" | "cancelled"
  string warn       = 3;  // non-fatal warning (retry-exhausted, etc.)
  bool   workflow_will_continue = 4;
}

// --- Message / reasoning streaming ---

message MessageDeltaPayload {
  string text = 1;
}

message MessageCommittedPayload {
  string turn_id = 1;
  string text    = 2;
}

message ReasoningDeltaPayload {
  string text = 1;
}

message UserMessageCommittedPayload {
  string turn_id = 1;
  string text    = 2;
}

message ConversationCompactedPayload {
  string turn_id = 1;
}

// --- Tool calls ---

message ToolCallStartedPayload {
  string turn_id      = 1;
  string tool_call_id = 2;
  string name         = 3;
  string arg_digest   = 4;
}

message ToolCallCompletedPayload {
  string tool_call_id   = 1;
  string name           = 2;
  string status         = 3;  // "ok" | "error" | "declined"
  string result_preview = 4;
  int64  duration_ms    = 5;
}

// --- Approval ---

message ApprovalRequestedPayload {
  string approval_id = 1;
  string tool_name   = 2;
  string headline    = 3;
  string detail      = 4;
  bool   read_action = 5;
}

message ApprovalResolvedPayload {
  string approval_id = 1;
  string outcome     = 2;  // "approved" | "declined" | "allowed_reads"
  string reason      = 3;  // non-empty on decline
  string resolver    = 4;  // UserID of who resolved
}

// --- Subagent ---

message SubagentSpawnedPayload {
  string subagent_id = 1;
  string task        = 2;
  string capability   = 3;  // "discovery" | "edit" | "tools"
  string backend      = 4;
  string model       = 5;
  repeated string tool_names = 6;
}

message SubagentProgressPayload {
  string subagent_id = 1;
  string text         = 2;
  bool   finished     = 3;
  string finished_status = 4;  // "ok"/"incomplete"/"failed"/"declined"
  double finished_cost_usd = 5;
  int32  finished_files_n  = 6;
}

message SubagentCompletedPayload {
  string subagent_id = 1;
  string status      = 2;  // "ok" | "failed" | "incomplete" | "declined"
  string summary_preview = 3;
  string err         = 4;
  double cost_usd    = 5;
  repeated string files_changed = 6;
  repeated string grounding     = 7;
  int32  ctx_size   = 8;
  int32  hard_max_bytes = 9;
  string used_backend   = 10;
}

// --- Memory ---

message MemoryProposedPayload {
  string key    = 1;
  string kind   = 2;
  string writer = 3;
}

// --- Guard / context ---

message GuardTriggeredPayload {
  string guard   = 1;
  string message = 2;
}

message ContextWarningPayload {
  string message = 1;
}

// --- Workflow ---

message WorkflowTurnStartedPayload {
  string turn_id   = 1;
  string user_text = 2;
}

message WorkflowFinalReviewPayload {
  string turn_id = 1;
}

message WorkflowOutcomePayload {
  string turn_id = 1;
  string outcome = 2;  // "declined" | "verify_failed" | "gaps"
  string reason  = 3;
}

message WorkflowWarningPayload {
  string message = 1;
}

// --- Async jobs / side questions ---

message AsyncJobStartedPayload {
  string op_id = 1;
  string label = 2;
}

message AsyncJobCompletedPayload {
  string op_id   = 1;
  string status  = 2;  // "ok" | "error" | "cancelled"
  string summary_preview = 3;
  string err     = 4;
}

message SideQuestionCompletedPayload {
  string op_id   = 1;
  string status  = 2;  // "ok" | "error" | "cancelled"
  string answer_preview = 3;
}

message TokRatePayload {
  double rate = 1;
}

message AsyncJobProgressPayload {
  string op_id = 1;
  string text  = 2;
}

message SideQuestionProgressPayload {
  string op_id = 1;
  string text  = 2;
}

message LearnNudgePayload {
  string text = 1;
}

message SessionNotePayload {
  string text = 1;
}

syntax = "proto3";

package wakil.v1alpha1;

option go_package = "github.com/treeol/wakil/api/gen/wakil/v1alpha1;wakilv1alpha1";

import "wakil/v1alpha1/workspace.proto";

// WorkspaceService manages project workspaces (design §3.3, §4.3).
//
// A workspace is a project root / working directory. Sessions pin a workspace
// at creation time. The host_path is the filesystem path on the daemon host
// that the sandbox mounts.
//
// RPC authentication policy:
//   - All RPCs: authenticated (owner/admin role within the caller's tenant).
//   - All queries are tenant-scoped: the caller's tenant_id filters every
//     operation.
service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
}

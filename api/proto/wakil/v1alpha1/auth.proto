syntax = "proto3";

package wakil.v1alpha1;

option go_package = "github.com/treeol/wakil/api/gen/wakil/v1alpha1;wakilv1alpha1";

import "google/protobuf/timestamp.proto";

// Principal is the wire representation of the resolved caller identity.
// Returned by WhoAmI and embedded in exchange responses (metadata only —
// credentials are delivered via Set-Cookie, never in the response body).
message Principal {
  string tenant_id   = 1;
  string user_id     = 2;
  string role        = 3;  // owner | admin | member | viewer
  string auth_method = 4;  // local | session | api_token | oidc
}

// JoinToken is the metadata view of a join token (no secrets).
message JoinToken {
  string id          = 1;
  string tenant_id   = 2;
  string user_id     = 3;  // empty = "create user on exchange"
  string role        = 4;
  string created_by  = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp used_at    = 8;  // empty = unused
  google.protobuf.Timestamp revoked_at = 9;  // empty = not revoked
}

// --- AuthService RPCs ---

message CreateJoinTokenRequest {
  string tenant_id    = 1;
  string role         = 2;  // owner | admin | member | viewer
  string user_id      = 3;  // optional: bind to existing user; empty = create on exchange
  string email        = 4;  // for create-on-exchange: new user's email
  string display_name = 5;  // for create-on-exchange: new user's display name
}

message CreateJoinTokenResponse {
  string token       = 1;  // plaintext join secret — shown ONCE, never again
  string id          = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ListJoinTokensRequest {
  string tenant_id = 1;
}

message ListJoinTokensResponse {
  repeated JoinToken tokens = 1;
}

message RevokeJoinTokenRequest {
  string id = 1;
}

message RevokeJoinTokenResponse {}

message ExchangeJoinTokenRequest {
  string token = 1;  // plaintext join secret (jnt_...)
  string email        = 2;  // for create-on-exchange: new user's email
  string display_name = 3;  // for create-on-exchange: new user's display name
}

message ExchangeJoinTokenResponse {
  Principal principal = 1;  // resolved identity (metadata only)
  // The session cookie is delivered via Set-Cookie header, not here.
}

message WhoAmIRequest {}

message WhoAmIResponse {
  Principal principal = 1;
}

message LogoutRequest {}

message LogoutResponse {}

// --- API Token management (P4d) ---

// APIToken is the metadata view of an API token (no secrets).
message APIToken {
  string id          = 1;
  string tenant_id   = 2;
  string user_id     = 3;
  string name        = 4;
  repeated string scopes = 5;  // e.g. ["sessions:read", "sessions:write"]
  google.protobuf.Timestamp expires_at = 6;  // empty = no expiry
  google.protobuf.Timestamp last_used_at = 7; // empty = never used
  google.protobuf.Timestamp revoked_at = 8;   // empty = not revoked
  google.protobuf.Timestamp created_at = 9;
}

message CreateAPITokenRequest {
  string name        = 1;  // human-readable label (e.g. "CI pipeline", "laptop")
  repeated string scopes = 2;  // scope strings; empty = inherit role permissions
  google.protobuf.Timestamp expires_at = 3;  // empty = no expiry
}

message CreateAPITokenResponse {
  string token       = 1;  // plaintext API secret (tok_...) — shown ONCE, never again
  string id          = 2;
  google.protobuf.Timestamp expires_at = 3;  // echoes request expiry (or empty)
}

message ListAPITokensRequest {
  string user_id = 1;  // optional: filter by user; empty = list own tokens
}

message ListAPITokensResponse {
  repeated APIToken tokens = 1;
}

message RevokeAPITokenRequest {
  string id = 1;
}

message RevokeAPITokenResponse {}

// --- OIDC (P4e) ---

// GetOIDCAuthURLRequest requests the OIDC authorization redirect URL.
// The caller's browser is redirected to this URL to begin the OIDC flow.
message GetOIDCAuthURLRequest {
  string redirect_uri = 1;  // optional: override configured redirect URI
}

message GetOIDCAuthURLResponse {
  string auth_url = 1;  // authorization endpoint URL at the IdP
}

// ExchangeOIDCCodeRequest exchanges an OIDC authorization code for a
// session cookie. The code is received at the redirect_uri after the user
// authenticates at the IdP.
message ExchangeOIDCCodeRequest {
  string code         = 1;  // authorization code from the IdP callback
  string redirect_uri = 2;  // must match the one used in GetOIDCAuthURL
}

message ExchangeOIDCCodeResponse {
  Principal principal = 1;  // resolved identity (metadata only)
  // The session cookie is delivered via Set-Cookie header, not here.
}

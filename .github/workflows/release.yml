name: Release

# Releases are created ONLY from pushes of version tags (v*) — never from
# branch pushes or workflow_dispatch. One tag = one immutable release.
on:
  push:
    tags: ["v*"]

# Nothing is granted by default; each job below lists exactly what it needs.
permissions: {}

# Never cancel a half-finished release; a second tag runs after the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SANDBOX_REPO: ghcr.io/treeol/wakil-sandbox

jobs:
  # 1. Build, push and sign the sandbox image; expose its DIGEST. The wakil
  #    binary built in job 2 embeds that digest (never a mutable tag), so the
  #    binary and the container it runs code in are a verifiable pair.
  sandbox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # arm64 under QEMU compiles kvr-server (cargo) — slow
    permissions:
      contents: read # checkout (subset of the workflow-level contents: write)
      packages: write # push to ghcr.io
      id-token: write # cosign keyless OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SANDBOX_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/treeol/wakil
            org.opencontainers.image.licenses=Apache-2.0

      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::bad digest '$DIGEST'"; exit 1; }
          cosign sign --yes "${SANDBOX_REPO}@${DIGEST}"

  # 2. Build + sign + publish the release, injecting the image digest.
  release:
    needs: sandbox-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release, upload assets
      packages: write
      id-token: write # cosign keyless (checksums) + attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: require digest-pinned sandbox image
        env:
          DIGEST: ${{ needs.sandbox-image.outputs.digest }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::sandbox image digest missing/invalid: '$DIGEST'"; exit 1; }

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SANDBOX_IMAGE: ghcr.io/treeol/wakil-sandbox@${{ needs.sandbox-image.outputs.digest }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

  # 3. Install the published packages and check the binary reports its tag and
  #    the same sandbox digest the image job produced.
  smoke:
    needs: [sandbox-image, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # gh release download
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.sandbox-image.outputs.digest }}
    steps:
      - name: download packages from the release
        run: |
          mkdir pkg && cd pkg
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*_linux_amd64.deb' --pattern '*_linux_amd64.rpm'
          ls -l

      - name: ubuntu — dpkg -i
        run: |
          sudo dpkg -i pkg/*_linux_amd64.deb
          out=$(wakil version)
          echo "$out"
          grep -qF "$TAG" <<<"$out" || { echo "::error::tag $TAG not in 'wakil version'"; exit 1; }
          grep -q "ghcr.io/treeol/wakil-sandbox@${DIGEST}" <<<"$out" || { echo "::error::pinned sandbox digest ${DIGEST} not in 'wakil version'"; exit 1; }
          grep -q 'sha256:' <<<"$out"

      - name: fedora — rpm -i
        run: |
          docker run --rm -e TAG -e DIGEST -v "$PWD/pkg:/pkg:ro" fedora:latest bash -euxc '
            rpm -i /pkg/*_linux_amd64.rpm
            out=$(wakil version)
            echo "$out"
            grep -qF "$TAG" <<<"$out"
            grep -q "ghcr.io/treeol/wakil-sandbox@${DIGEST}" <<<"$out"
            grep -q "sha256:" <<<"$out"
          '

name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly re-scan: a dependency that was clean at merge time can become
  # vulnerable later with no code change. The race suite runs on this schedule
  # (govulncheck has its own workflow: .github/workflows/govulncheck.yml).
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to format these files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: deadcode (test roots)
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          deadcode -test ./...

      - name: build
        run: go build ./...

      # Pull the wakil-dev sandbox image from Docker Hub so the Docker-
      # dependent integration tests (internal/exec/live_docker_test.go)
      # can run in CI. Retag as wakil-dev:latest to match what the test
      # code expects. Skip gracefully if the pull fails — the tests
      # self-skip when the image is unavailable.
      - name: pull sandbox image
        run: |
          docker pull vmamudi/wakil-dev:latest \
            && docker tag vmamudi/wakil-dev:latest wakil-dev:latest \
            || echo "⚠ wakil-dev image pull failed — Docker integration tests will skip"

      # ubuntu-24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1,
      # which makes `unshare -Ur` fail (uid_map write EPERM) in a container run
      # with apparmor=unconfined. TestLiveDockerAllowUserns needs it off.
      - name: allow unprivileged user namespaces (for allow_userns test)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: test (with coverage)
        run: |
          set -euo pipefail
          go test -count=1 -cover ./... | tee cover.txt
          LC_ALL=C go test -count=1 ./...

      - name: coverage floors (agent/tools/exec/proxy)
        run: scripts/check_coverage.sh cover.txt

      # Verify every key in config.example.json is documented in
      # docs/configuration.md — catches config-doc drift.
      - name: config-doc consistency
        run: scripts/check_config_docs.sh

      # Dockerfile golang pins must equal go.mod's `go` directive.
      - name: Dockerfile Go version pins
        run: scripts/check_go_version_pins.sh

      - name: coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.txt
          retention-days: 14

      # Full-repo race: measured ~40s on this codebase (2026-07-19), so the
      # former 4-package scope was widened.
      - name: race detector
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.1

  # macOS compile gate — verifies the repo cross-compiles clean for darwin
  # (amd64 + arm64) without requiring a macOS runner. Catches platform-specific
  # breakage (syscall differences, build-tag issues) before it reaches a Mac user.
  # Runs vet with GOOS=darwin too, since some vet checks are platform-sensitive.
  darwin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build ./...

      - name: build (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: vet (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go vet ./...

  # Release-pipeline gate: the goreleaser config must keep building all four
  # targets (snapshot: no publish, no signing, no packages), and the sandbox
  # Dockerfile must keep building for both release platforms (push: false).
  # release.yml only runs on tags, so without this a broken config or
  # Dockerfile would first surface on the real tag push.
  goreleaser-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  # Docker image build gate — catches bit-rot in the Dockerfiles (e.g. the
  # kvr-server git-clone step, base-image digest drift, apt repo changes)
  # before it reaches a release. Runs on Dockerfile changes and weekly.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build sandbox image (Dockerfile)
        run: docker build -t wakil-dev:ci .

  # Same Dockerfile, built exactly as release.yml builds it (buildx, amd64 +
  # arm64 via QEMU), but never pushed. Catches arm64-only breakage early.
  sandbox-image-multiarch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hisn-integration:
    name: real-hisn integration (skips cleanly without hisn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: run real-hisn tests if hisn is present
        run: |
          set -euo pipefail
          if ! command -v hisn >/dev/null 2>&1; then
            echo "hisn not on PATH: real-hisn integration tests are skipped in this job"
            exit 0
          fi
          if ! hisn check >/dev/null 2>&1; then
            echo "hisn present but 'hisn check' fails on this runner: skipping real-hisn tests"
            exit 0
          fi
          go test -count=1 -v -timeout 10m -run TestIntegration ./internal/sandbox/hisn/

  # Quick installer (install.sh): shellcheck, then a real install of a published
  # release in a clean container per distro. The quickstart config does not exist
  # in v0.6.0, which is fine: the job passes --no-config. hisn check is allowed to
  # fail here (containers lack user namespaces); what is asserted is that the
  # right hisn variant was picked and that the installed binaries run.
  installer:
    name: installer (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates tar >/dev/null
            hisn: hisn-x86_64-linux-gnu
          - image: debian:12
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates tar >/dev/null
            hisn: hisn-x86_64-linux-gnu
          - image: fedora:latest
            prep: dnf install -y -q curl tar gawk >/dev/null
            hisn: hisn-x86_64-linux-gnu
          - image: alpine:latest
            prep: apk add --no-cache curl tar >/dev/null
            hisn: hisn-x86_64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh

      - name: install v0.6.0 in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PREP: ${{ matrix.prep }}
          WANT_HISN: ${{ matrix.hisn }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/bin"
          docker run --rm -e PREFIX="$prefix" -e WANT_HISN -e PREP \
            -v "$PWD/install.sh:/install.sh:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            "$IMAGE" sh -eu -c '
              sh -c "$PREP"
              out=$(sh /install.sh --version v0.6.0 --no-config --prefix "$PREFIX" 2>&1) || { echo "$out"; exit 1; }
              echo "$out"
              # The right hisn variant was chosen for this libc.
              printf "%s\n" "$out" | grep -qF "hisn: $WANT_HISN" || { echo "::error::expected hisn variant $WANT_HISN"; exit 1; }
              # The binaries run. hisn check may fail in a container, hisn --version may not.
              "$PREFIX/wakil" version | grep -qF "wakil v0.6.0" || { echo "::error::wakil version"; exit 1; }
              "$PREFIX/hisn" --version | grep -qF "hisn 0.4.1" || { echo "::error::hisn --version"; exit 1; }
              # Root in the container, so kvr-server goes to /usr/local/bin.
              test -x /usr/local/bin/kvr-server || { echo "::error::kvr-server not installed"; exit 1; }
              # Uninstall removes what was installed, nothing else.
              sh /install.sh --uninstall --prefix "$PREFIX"
              test ! -e "$PREFIX/wakil" && test ! -e "$PREFIX/hisn" && test ! -e /usr/local/bin/kvr-server
            '

      - name: tampered download aborts before installing
        env:
          IMAGE: ${{ matrix.image }}
          PREP: ${{ matrix.prep }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/bin-tamper"
          docker run --rm -e PREFIX="$prefix" -e PREP \
            -v "$PWD/install.sh:/install.sh:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            "$IMAGE" sh -eu -c '
              sh -c "$PREP"
              if WAKIL_INSTALL_TEST_CORRUPT=1 sh /install.sh --version v0.6.0 --no-config --prefix "$PREFIX"; then
                echo "::error::install succeeded with a corrupted download"; exit 1
              fi
              test -z "$(ls -A "$PREFIX" 2>/dev/null)" || { echo "::error::files were installed despite the mismatch"; exit 1; }
              test ! -e /usr/local/bin/kvr-server
            '
